name: Room Monitor CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Scan public repository for accidental secrets
        run: python tools/audit_public_release.py
      - name: Generate temporary CI-only administrator credential
        run: python tools/generate_secrets.py
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Static regression checks
        run: python tools/validate_project.py
      - name: Browser JavaScript syntax checks
        run: python tools/check_inline_js.py
      - name: Build firmware
        run: platformio run
      - name: Build SPIFFS
        run: platformio run -t buildfs
